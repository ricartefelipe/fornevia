# Ambiente de desenvolvimento do Fornevia.
#
#   docker compose up -d                      # app, web, horizon, scheduler, outbox, postgres, redis, mailpit
#   docker compose run --rm migrate           # migrations com o papel de manutenção
#   docker compose run --rm app composer test # suíte de testes
#   docker compose --profile browser up -d selenium
#
# Portas publicadas apenas em 127.0.0.1 e configuráveis por variáveis
# FORWARD_* para evitar conflito com outros serviços locais.
name: fornevia

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: fornevia-php:dev
  volumes:
    - .:/var/www/html
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *php
    command: ["php-fpm"]
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine3.24
    environment:
      FPM_HOST: app
      FPM_PORT: 9000
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./public:/var/www/html/public:ro
    ports:
      - "127.0.0.1:${FORWARD_WEB_PORT:-8090}:8080"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  horizon:
    <<: *php
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  outbox:
    <<: *php
    command: ["php", "artisan", "outbox:relay"]
    stop_grace_period: 30s

  migrate:
    <<: *php
    profiles: ["tools"]
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_CONNECTION: pgsql_owner
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: ["php", "artisan", "migrate", "--force"]

  node:
    image: node:26.13.1-alpine3.24
    profiles: ["tools"]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run build"]

  postgres:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:-postgres-local}
      FORNEVIA_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-owner-local}
      FORNEVIA_APP_PASSWORD: ${DB_PASSWORD:-app-local}
      FORNEVIA_RELAY_PASSWORD: ${DB_RELAY_PASSWORD:-relay-local}
      FORNEVIA_DATABASES: fornevia fornevia_test fornevia_browser
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fornevia"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine3.23
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-63799}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${FORWARD_MAILPIT_UI_PORT:-8035}:8025"
    restart: unless-stopped

  selenium:
    image: selenium/standalone-chromium:156.0-chromedriver-156.0-grid-4.52.0-20261101
    profiles: ["browser"]
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: 2
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
