title = "Fornevia"

[extend]
useDefault = true

# Valores fixos de ambientes locais, CI e testes (não são segredos reais).
[[allowlists]]
description = "Credenciais locais e de teste documentadas"
paths = [
  '''^\.env\.example$''',
  '''^phpunit\.xml$''',
  '''^compose\.yaml$''',
  '''^\.github/workflows/ci\.yml$''',
]

# Senhas fictícias usadas em testes automatizados de autenticação. A exceção
# vale apenas para a regra genérica e para o diretório de testes.
[[allowlists]]
description = "Credenciais fictícias de testes automatizados"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)tests/''',
]
