{{- $c := dict "root" . "component" "web" -}}
{{- $host := get (urlParse .Values.config.APP_URL) "host" | default "localhost" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fornevia.fullname" . }}-web
  labels: {{- include "fornevia.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {{- include "fornevia.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "fornevia.selector" $c | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "fornevia.podCommon" $c | nindent 6 }}
      containers:
        - name: nginx
          image: {{ include "fornevia.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: FPM_HOST, value: {{ include "fornevia.fullname" . }}-app}
            - {name: FPM_PORT, value: "9000"}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: conf, mountPath: /etc/nginx/conf.d}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - {name: Host, value: {{ $host | quote }}}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Vivacidade do próprio nginx: uma falha do PHP ou do banco não deve reiniciar o proxy.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: cache, emptyDir: {}}
        - {name: conf, emptyDir: {}}
