{{- $root := . -}}
{{- $workers := list
  (dict "name" "horizon" "command" (list "fornevia-start" "php" "artisan" "horizon") "replicas" .Values.horizon.replicas "grace" .Values.horizon.terminationGracePeriodSeconds "resources" .Values.horizon.resources "strategy" "RollingUpdate")
  (dict "name" "outbox" "command" (list "fornevia-start" "php" "artisan" "outbox:relay") "replicas" .Values.outbox.replicas "grace" .Values.outbox.terminationGracePeriodSeconds "resources" .Values.outbox.resources "strategy" "RollingUpdate")
  (dict "name" "scheduler" "command" (list "fornevia-start" "php" "artisan" "schedule:work") "replicas" 1 "grace" 30 "resources" .Values.scheduler.resources "strategy" "Recreate")
-}}
{{- range $w := $workers }}
{{- $c := dict "root" $root "component" $w.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fornevia.fullname" $root }}-{{ $w.name }}
  labels: {{- include "fornevia.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $w.name }}
spec:
  replicas: {{ $w.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: {{ $w.strategy }}
  selector:
    matchLabels: {{- include "fornevia.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "fornevia.selector" $c | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- with $root.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ $w.grace }}
      {{- include "fornevia.podCommon" $c | nindent 6 }}
      containers:
        - name: {{ $w.name }}
          image: {{ include "fornevia.appImage" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: {{ toJson $w.command }}
          {{- include "fornevia.phpEnv" $root | nindent 10 }}
          {{- include "fornevia.phpSecurityContext" $root | nindent 10 }}
          {{- if eq $w.name "horizon" }}
          livenessProbe:
            exec:
              command: ["php", "artisan", "horizon:status"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 20
          {{- end }}
          resources: {{- toYaml $w.resources | nindent 12 }}
      {{- include "fornevia.phpVolumes" $root | nindent 6 }}
{{- end }}
